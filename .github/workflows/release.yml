name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: node scripts/build.mjs --check-tag "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/zotero-handwritten-notes-*.xpi
            build/updates.json
          fail_on_unmatched_files: true
          make_latest: "true"
          generate_release_notes: true
